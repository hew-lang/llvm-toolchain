# Keep one Windows MSVC LLVM toolchain per release series (e.g. 23.1) built
# from the latest stable llvm-project release in that series, and publish it
# for hew-lang/hew.
#
# GitHub cannot notify this repo of a new llvm-project release, so a daily
# plan job polls the tags. When every tracked series is current the Windows
# build never starts.
#
# A series is tracked once it has a release here, or when LLVM ships a newer
# series than any tracked one. Each series has a single floating release:
#
#   Release tag:  toolchain/llvm-<series>-windows-msvc
#   Release name: LLVM <version> Windows MSVC toolchain  (the version built)
#   Assets:       hew-llvm-<series>-windows-msvc.tar.gz (+ .sha256)
#   Archive root: llvm-<major>/  (extracts to C:\llvm-<major>)
#
# A new patch release replaces the assets in place. The release name is
# updated last, so an interrupted publish is rebuilt on the next run.

name: Pre-build LLVM

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      llvm_series:
        description: "Rebuild this series (e.g. 23.1) from its latest release. Empty builds whatever is out of date."
        required: false
        default: ""
        type: string

concurrency:
  group: prebuild-llvm
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}  # no checkout, so gh needs the repo named

jobs:
  plan:
    name: Find out-of-date series
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Compare LLVM releases with published toolchains
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.llvm_series }}
        run: |
          set -euo pipefail

          # Stable releases only: llvmorg-X.Y.Z, no -rc or -init tags.
          released=$(git ls-remote --tags --refs https://github.com/llvm/llvm-project.git 'llvmorg-*' \
            | sed 's|.*refs/tags/llvmorg-||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V)

          # Latest release of each series ("23.1 23.1.3").
          latest=$(awk -F. '{ latest[$1"."$2] = $0 } END { for (s in latest) print s, latest[s] }' <<< "$released" \
            | sort -V)

          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')

          if [ -n "$REQUESTED" ]; then
            if ! grep -q "^${REQUESTED//./\\.} " <<< "$latest"; then
              echo "::error::No stable LLVM release in series $REQUESTED"
              exit 1
            fi
            wanted=$(grep "^${REQUESTED//./\\.} " <<< "$latest")
          else
            # Any series with a release here is tracked, including the
            # versioned releases that predate the floating ones.
            tracked=$(sed -nE 's|^toolchain/llvm-([0-9]+\.[0-9]+)(\.[0-9]+)?-windows-msvc.*|\1|p' <<< "$releases" | sort -uV)
            newest=$(tail -n 1 <<< "$tracked")
            wanted=$(while read -r series version; do
              if grep -qxF "$series" <<< "$tracked" \
                 || { [ -n "$newest" ] && printf '%s\n%s\n' "$newest" "$series" | sort -V -C -u; }; then
                echo "$series $version"
              fi
            done <<< "$latest")
          fi

          todo=()
          while read -r series version; do
            [ -n "$series" ] || continue
            tag="toolchain/llvm-${series}-windows-msvc"
            if [ -z "$REQUESTED" ] && grep -qxF "$tag" <<< "$releases"; then
              name=$(gh release view "$tag" --json name --jq .name)
              [[ "$name" == "LLVM ${version} Windows MSVC toolchain" ]] && continue
            fi
            todo+=("$series $version")
          done <<< "$wanted"

          if [ ${#todo[@]} -eq 0 ]; then
            matrix='{"include":[]}'
          else
            matrix=$(printf '%s\n' "${todo[@]}" | jq -Rnc '{include: [inputs | split(" ") | {
              series: .[0],
              version: .[1],
              major: (.[0] | split(".")[0]),
              tag: "toolchain/llvm-\(.[0])-windows-msvc",
              asset: "hew-llvm-\(.[0])-windows-msvc.tar.gz"
            }]}')
          fi

          echo "To build: ${todo[*]:-nothing}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=${#todo[@]}" >> "$GITHUB_OUTPUT"

  windows-toolchain:
    name: LLVM ${{ matrix.series }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write       # create the toolchain release and upload assets
      id-token: write       # OIDC token for build-provenance attestation
      attestations: write   # GitHub Attestations API
    env:
      LLVM_VERSION: ${{ matrix.version }}
      LLVM_TAG: llvmorg-${{ matrix.version }}
      PREFIX: C:\llvm-${{ matrix.major }}
      RELEASE_TAG: ${{ matrix.tag }}
      ASSET: ${{ matrix.asset }}

    steps:
      - name: Set up MSVC developer environment and Ninja
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath) | Select-Object -First 1
          if (-not $vsInstall) { throw "Visual Studio with MSVC tools not found" }

          # Ninja ships with Visual Studio's CMake component.
          $ninjaDir = "$vsInstall\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          $ninjaDir | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append

          # Export the variables vcvars64.bat sets to later steps.
          $pathBefore = $env:PATH -split ';' | Where-Object { $_ }
          $vcEnv = cmd.exe /c "`"$vsInstall\VC\Auxiliary\Build\vcvars64.bat`" x64 > nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          $keep = @(
            'CommandPromptType', 'DevEnvDir', 'ExtensionSdkDir', 'FrameworkDir',
            'FrameworkDIR64', 'FrameworkVersion', 'FrameworkVersion64', 'INCLUDE',
            'LIB', 'LIBPATH', 'NETFXSDKDir', 'Platform', 'UCRTVersion',
            'UniversalCRTSdkDir', 'VCIDEInstallDir', 'VCINSTALLDIR',
            'VCToolsInstallDir', 'VCToolsRedistDir', 'VCToolsVersion',
            'VisualStudioVersion', 'VS170COMNTOOLS', 'VSCMD_ARG_app_plat',
            'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_VER',
            'VSINSTALLDIR', 'WindowsLibPath', 'WindowsSdkBinPath', 'WindowsSdkDir',
            'WindowsSDKLibVersion', 'WindowsSDKVersion'
          )
          foreach ($line in $vcEnv) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -ieq 'PATH') {
              $value -split ';' | Where-Object { $_ -and ($pathBefore -notcontains $_) } |
                Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append
            } elseif ($keep -contains $name) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            }
          }

      - name: Clone llvm-project
        shell: pwsh
        run: |
          # D:\ has more free space than C:\ on windows-2022 runners.
          git clone --depth 1 --branch $env:LLVM_TAG --filter=blob:none --sparse `
            --config core.longpaths=true https://github.com/llvm/llvm-project.git D:\llvm-src
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          Set-Location D:\llvm-src
          # LLD's Mach-O support includes libunwind's compact-unwind header.
          git sparse-checkout set llvm clang lld libunwind cmake third-party
          if ($LASTEXITCODE -ne 0) { throw "git sparse-checkout failed" }

      - name: Configure
        shell: pwsh
        run: |
          # Hew links LLVM statically through llvm-sys against the UCRT. LLVM's
          # integrated rpmalloc would export malloc/free/calloc/realloc a second
          # time, so LLVM_INTEGRATED_CRT_ALLOC stays off.
          cmake -S D:\llvm-src\llvm -B D:\llvm-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:PREFIX" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DLLVM_ENABLE_PROJECTS="clang;lld" `
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;WebAssembly" `
            -DLLVM_BUILD_TOOLS=ON `
            -DLLVM_BUILD_UTILS=ON `
            -DLLVM_INSTALL_UTILS=ON `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_DOCS=OFF `
            -DLLVM_ENABLE_BINDINGS=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_INTEGRATED_CRT_ALLOC=OFF `
            -DLLVM_BUILD_LLVM_DYLIB=OFF `
            -DBUILD_SHARED_LIBS=OFF
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build and install
        shell: pwsh
        run: |
          cmake --build D:\llvm-build --target install --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          # Free disk space before packaging.
          Remove-Item -Recurse -Force D:\llvm-src, D:\llvm-build -ErrorAction SilentlyContinue

      - name: Validate install
        shell: pwsh
        run: |
          foreach ($path in "bin\clang.exe", "bin\lld-link.exe", "bin\llvm-ar.exe",
                            "lib\cmake\llvm\LLVMConfig.cmake") {
            if (-not (Test-Path "$env:PREFIX\$path")) { throw "Missing from install: $path" }
          }

          # rpmalloc.c.obj in a static library duplicates the UCRT allocator
          # symbols and breaks Hew's lld-link step.
          $llvmAr = "$env:PREFIX\bin\llvm-ar.exe"
          $leaks = foreach ($lib in Get-ChildItem "$env:PREFIX\lib" -Filter *.lib -Recurse -File) {
            $members = & $llvmAr t $lib.FullName
            if ($LASTEXITCODE -ne 0) { throw "llvm-ar could not read $($lib.FullName)" }
            $members | Where-Object { $_ -match '(?i)rpmalloc\.c\.obj$' } |
              ForEach-Object { "$($lib.Name): $_" }
          }
          if ($leaks) { throw "Integrated rpmalloc leaked into the install: $($leaks -join '; ')" }

      - name: Package
        shell: bash
        run: |
          # Archive root llvm-<major>/ extracts to C:\llvm-<major>.
          tar -czf "$ASSET" -C /c "${PREFIX##*\\}"
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Attest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The release name is the completion marker the plan checks, so mark
          # the release incomplete before touching its assets.
          pending="LLVM ${LLVM_VERSION} Windows MSVC toolchain (publishing)"
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qxF "$RELEASE_TAG" <<< "$releases"; then
            gh release edit "$RELEASE_TAG" --title "$pending"
          else
            gh release create "$RELEASE_TAG" \
              --title "$pending" \
              --notes "Source-built LLVM for Hew Windows builds. Archive root: ${PREFIX##*\\}/. Consumed by hew-lang/hew's CI and release pipeline." \
              --latest=false \
              --prerelease
          fi

          # The new assets replace the previous patch release's.
          gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber
          gh release edit "$RELEASE_TAG" --title "LLVM ${LLVM_VERSION} Windows MSVC toolchain"
